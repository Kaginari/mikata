[package]
name = "mikata-proving"
description = "The Dark Elf's proving: the finding record, its validator, and the reading of a Dark Elf's report against the landing's tree."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
mikata-races = { path = "../mikata-races" }
mikata-wire = { path = "../mikata-wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
proptest = "1"
tempfile = "3"
toml = "1"

[lints]
workspace = true
