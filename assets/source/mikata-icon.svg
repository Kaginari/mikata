<!-- Mikata's icon: the mark (mikata-mark.png, the owner's fusion cell: a living cell becoming a
     digital one) on its tile. Rendered to assets/brand by tools/brand.mjs. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1426"/><stop offset="1" stop-color="#0d0b10"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF168A"/><stop offset="1" stop-color="#FFB020"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#tile)" stroke="url(#rim)" stroke-width="6" stroke-opacity=".7"/>
  <image href="mikata-mark.png" x="28" y="174" width="456" height="165"/>
</svg>
