<!-- GitHub's link card, 1280×640. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#3a1430"/><stop offset="1" stop-color="#0d0b10"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF168A"/><stop offset=".55" stop-color="#FF655C"/><stop offset="1" stop-color="#FFB020"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect y="604" width="1280" height="36" fill="url(#bar)"/>
  <image href="mikata-mark.png" x="230" y="60" width="820" height="297"/>
  <text x="640" y="450" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="96" fill="#F4EEF5">mikata <tspan font-family="Noto Sans JP, sans-serif" font-size="84" fill="#FF655C">味方</tspan></text>
  <text x="640" y="525" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="600" font-size="38" fill="#C0ADBF">the coding agent on your side</text>
</svg>
